id: ltw_mv
name: Landtagswahl Mecklenburg-Vorpommern 2026
hashtag: "#ltwmv"

scraper:
  function: scrape_ltw
  url: https://www.wahlrecht.de/umfragen/landtage/mecklenburg-vorpommern.htm
  ind_row_remove: [1]

parliament:
  seats: 71
  majority: 36
  hurdle: 0.05
  seat_allocation: hare_niemeyer

pooling:
  period: 14
  period_extended: 100

parties:
  - id: spd
    label: SPD
    color: "#E3000F"
    required: true
  - id: afd
    label: AfD
    color: "#82caff"
    required: true
  - id: cdu
    label: Union
    color: "#000000"
    required: true
  - id: left
    label: Linke
    color: "#ff1493"
    required: false
  - id: greens
    label: Grüne
    color: "#46962b"
    required: false
  - id: fdp
    label: FDP
    color: "#ffed00"
    required: false
  - id: bsw
    label: BSW
    color: "#6d1f99"
    required: false
  - id: others
    label: Sonstige
    color: "#808080"
    required: false

pollsters:
  - allensbach
  - emnid
  - forsa
  - fgw
  - gms
  - infratest
  - insa

# coalitions: dynamically derived at compute time from current pooled vote
# shares (see derive_dynamic_coalitions() in scripts/calc_coalProbs_helpers.R).
# Leaving this key absent/empty is what triggers the dynamic path.

analyses:
  biggest_party:
    - parties: [spd, afd]
      label: "Wer wird stärkste Kraft?"
  pass_hurdle:
    parties: [greens, fdp, bsw]
    label: "Schaffen es die folgenden Parteien in den Landtag?"
