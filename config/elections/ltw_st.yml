id: ltw_st
name: Landtagswahl Sachsen-Anhalt 2026
hashtag: "#ltwst"

last_result:
  url: https://www.wahlrecht.de/ergebnisse/sachsen-anhalt.htm
  year: 2021

scraper:
  function: scrape_ltw
  url: https://www.wahlrecht.de/umfragen/landtage/sachsen-anhalt.htm
  ind_row_remove: [1, 2]
  # 100-day pooling window, so pooled estimates are complete from 2024-11-05 on
  oldest_date: 2024-07-28

parliament:
  seats: 83
  majority: 42
  hurdle: 0.05
  seat_allocation: hare_niemeyer

pooling:
  period: 14
  period_extended: 100

parties:
  - id: cdu
    label: Union
    color: "#000000"
    required: true
  - id: afd
    label: AfD
    color: "#82caff"
    required: true
  - id: left
    label: Linke
    color: "#ff1493"
    required: true
  - id: spd
    label: SPD
    color: "#E3000F"
    required: true
  - id: greens
    label: Grüne
    color: "#46962b"
    required: false
  - id: bsw
    label: BSW
    color: "#6d1f99"
    required: false
  - id: fdp
    label: FDP
    color: "#ffed00"
    required: false
  - id: others
    label: Sonstige
    color: "#808080"
    required: false

pollsters:
  - allensbach
  - civey
  - emnid
  - forsa
  - fgw
  - gms
  - infratest
  - insa

# coalitions: dynamically derived at compute time from current pooled vote
# shares (see derive_dynamic_coalitions() in scripts/calc_coalProbs_helpers.R).
# Leaving this key absent/empty is what triggers the dynamic path.

analyses:
  biggest_party:
    - parties: [cdu, afd]
      label: "Wer wird stärkste Kraft?"
    - parties: [left, spd, bsw, greens]
      label: "Wer wird drittstärkste Kraft?"
  pass_hurdle:
    parties: [spd, greens, bsw, fdp]
    label: "Schaffen es die folgenden Parteien in den Landtag?"
  afd_majority:
    parties: [afd]
    label: "Erreicht die AfD eine absolute Mehrheit?"
