id: btw
name: Bundestagswahl 2029
hashtag: "#btwwahl"

last_result:
  url: https://www.wahlrecht.de/ergebnisse/bundestag.htm
  year: 2025

scraper:
  function: scrape_btw
  # 28-day pooling window, so pooled estimates are complete from 2024-12-29 on
  oldest_date: 2024-12-01

parliament:
  seats: 630
  majority: 316
  hurdle: 0.05
  seat_allocation: sls

pooling:
  period: 14
  period_extended: 28

parties:
  - id: cdu
    label: Union
    color: "#000000"
    required: true
  - id: afd
    label: AfD
    color: "#82caff"
    required: true
  - id: spd
    label: SPD
    color: "#E3000F"
    required: true
  - id: greens
    label: Grüne
    color: "#46962b"
    required: true
  - id: left
    label: Linke
    color: "#ff1493"
    required: true
  - id: bsw
    label: BSW
    color: "#6d1f99"
    required: false
  - id: fdp
    label: FDP
    color: "#ffed00"
    required: false
  - id: others
    label: Sonstige
    color: "#808080"
    required: true

pollsters:
  - allensbach
  - emnid
  - forsa
  - fgw
  - gms
  - infratest
  - insa

# coalitions: dynamically derived at compute time from current pooled vote
# shares (see derive_dynamic_coalitions() in scripts/calc_coalProbs_helpers.R).
# Leaving this key absent/empty is what triggers the dynamic path.

analyses:
  biggest_party:
    - parties: [cdu, spd, greens, left, afd]
      label: "Wer wird stärkste Kraft?"
  pass_hurdle:
    parties: [fdp, bsw]
    label: "Schaffen es die folgenden Parteien in den Bundestag?"
