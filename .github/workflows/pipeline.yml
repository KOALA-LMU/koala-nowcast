name: Nowcast Pipeline

on:
  schedule:
    - cron: '23 */2 * * *'   # every 2 hours at :23 UTC, off the hour to avoid GitHub's scheduling peak

  workflow_dispatch:
    inputs:
      skip_compute:
        description: 'Redeploy the site without scraping or recomputing'
        type: boolean
        default: false

  push:
    branches:
      - master
      - dev

permissions:
  contents: write   # the data branch
  pages: write
  id-token: write

concurrency:
  group: koala-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      # A push changes code, not poll data, so it renders without scraping.
      RUN_COMPUTE: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.skip_compute) }}

    steps:
      # The site always renders master and dev; compute runs the triggering ref.
      - name: Check out pipeline code
        uses: actions/checkout@v4
        with:
          path: pipeline

      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          path: stable

      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          path: beta

      # State lives on the branch `data`: a single commit with no history,
      # every file gzipped, since GitHub refuses files over 100 MB and the full
      # history of shares.json is larger than that. Until the branch exists, the
      # data is taken over once from the Supabase bucket it replaces.
      - name: Fetch pipeline data
        id: fetch
        env:
          SUPABASE_ENDPOINT: https://ddkvzjhqyhwhjpsaaunv.storage.supabase.co/storage/v1/s3
          AWS_ACCESS_KEY_ID: ${{ secrets.SUPABASE_REBUILD_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_REBUILD_SECRET }}
          AWS_DEFAULT_REGION: eu-west-1
        run: |
          mkdir -p pipeline/data/surveys pipeline/data/results
          remote="https://github.com/$GITHUB_REPOSITORY"
          if git ls-remote --exit-code --heads "$remote" data >/dev/null; then
            git clone --quiet --depth 1 --branch data "$remote" data-store
            rm -rf data-store/.git
            find data-store -type f -name '*.gz' -exec gunzip {} +
            cp -R data-store/. pipeline/data/
          else
            # Path-style addressing, the classic transfer client and checksums
            # only where required: what Supabase's S3 endpoint accepts.
            aws configure set default.s3.addressing_style path
            aws configure set default.s3.preferred_transfer_client classic
            aws configure set default.request_checksum_calculation when_required
            aws configure set default.response_checksum_validation when_required
            for dir in surveys results; do
              aws s3 sync "s3://data/$dir" "pipeline/data/$dir/" \
                --endpoint-url "$SUPABASE_ENDPOINT" --no-progress
            done
            echo "from_bucket=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if results exist
        id: check_results
        run: |
          if [ -z "$(ls -A pipeline/data/results 2>/dev/null)" ]; then
            echo "has_results=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_results=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: pipeline
          extra-packages: knitr, rmarkdown

      - name: Scrape and pool polls
        id: scrape
        if: env.RUN_COMPUTE == 'true'
        working-directory: pipeline
        run: |
          Rscript -e '
            source("scripts/scrape_polls.R")
            configs <- list.files("config/elections", pattern = "\\.yml$", full.names = TRUE)
            new_data <- any(sapply(configs, scrape_election))
            cat(paste0("new_data=", new_data, "\n"), file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)
          '

      # Backup for when a run uploads surveys but not results: the next scrape
      # sees those polls as present and reports new_raw=FALSE, so the gap never
      # closes. Comparing scraped against computed dates catches it either way.
      - name: Check for scraped dates without results
        id: pending
        if: env.RUN_COMPUTE == 'true'
        working-directory: pipeline
        run: |
          Rscript -e '
            source("scripts/pending_configs.R")
            configs <- list.files("config/elections", pattern = "\\.yml$", full.names = TRUE)
            pending <- length(configs_todo(configs)) > 0
            cat(paste0("pending=", pending, "\n"), file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)
          '

      - name: Decide what to compute and render
        id: gate
        env:
          NEW_DATA: ${{ steps.scrape.outputs.new_data }}
          PENDING: ${{ steps.pending.outputs.pending }}
          HAS_RESULTS: ${{ steps.check_results.outputs.has_results }}
        run: |
          changed=false
          if [ "$RUN_COMPUTE" = "true" ] &&
             { [ "$NEW_DATA" = "TRUE" ] || [ "$PENDING" = "TRUE" ] || [ "$HAS_RESULTS" = "false" ]; }; then
            changed=true
          fi

          # A schedule rebuilds only when the numbers moved; a push and a
          # dispatch changed the site itself, so they rebuild regardless.
          render=$changed
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then render=true; fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "render=$render" >> "$GITHUB_OUTPUT"
          echo "changed=$changed, render=$render" >> "$GITHUB_STEP_SUMMARY"

      - name: Compute coalition probabilities
        if: steps.gate.outputs.changed == 'true'
        working-directory: pipeline
        env:
          FORCE_ALL: ${{ steps.check_results.outputs.has_results == 'false' }}
        run: |
          Rscript -e '
            suppressPackageStartupMessages({ library(coalitions); library(dplyr); library(tidyr); library(yaml); library(jsonlite) })
            source("scripts/calc_coalProbs_helpers.R")
            source("scripts/calc_coalProbs.R")
            source("scripts/pending_configs.R")
            configs <- list.files("config/elections", pattern = "\\.yml$", full.names = TRUE)
            todo <- configs_todo(configs, force_all = Sys.getenv("FORCE_ALL") == "true")
            invisible(lapply(todo, calc_coalProbs, cores = 4))
          '

      # One commit replaces the last, so the files always come from the same
      # run and the branch does not grow with every update. The state it
      # replaces is kept as data-previous, for rolling back by hand. Data just
      # taken over from the bucket is saved even if nothing else changed, so
      # the next run reads the branch.
      - name: Save pipeline data to the data branch
        if: steps.gate.outputs.changed == 'true' || steps.fetch.outputs.from_bucket == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/$GITHUB_REPOSITORY"
          mkdir data-next
          cp -R pipeline/data/surveys pipeline/data/results data-next/
          cd data-next
          find . -type f -exec gzip -n {} +
          git init --quiet --initial-branch data
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "Data from run $GITHUB_RUN_ID"
          if git ls-remote --exit-code --heads "$remote" data >/dev/null; then
            git fetch --quiet --depth 1 "$remote" data
            git push --quiet --force "$remote" FETCH_HEAD:refs/heads/data-previous
          fi
          git push --quiet --force "$remote" HEAD:refs/heads/data

      - name: Hand the data to both site checkouts
        if: steps.gate.outputs.render == 'true'
        run: |
          for site in stable beta; do
            mkdir -p "$site/data"
            cp -R pipeline/data/. "$site/data/"
          done

      - uses: quarto-dev/quarto-actions/setup@v2
        if: steps.gate.outputs.render == 'true'

      - name: Prepare stable dashboard data
        if: steps.gate.outputs.render == 'true'
        working-directory: stable
        run: Rscript dashboard/prepare_data.R

      - name: Render stable dashboard and blog
        if: steps.gate.outputs.render == 'true'
        working-directory: stable
        run: |
          for post in dashboard/blog/*/index.qmd; do
            [ -e "$post" ] || continue
            quarto render "$post"
          done

          quarto render dashboard/index.qmd --output-dir _site

          if [ -d dashboard/blog ]; then
            find dashboard/blog -path '*/index.html' -type f | while IFS= read -r html; do
              dest="dashboard/_site/${html#dashboard/}"
              mkdir -p "$(dirname "$dest")"
              cp "$html" "$dest"
            done
          fi

      - name: Prepare beta dashboard data
        id: beta_prepare
        if: steps.gate.outputs.render == 'true'
        continue-on-error: true
        working-directory: beta
        run: Rscript dashboard/prepare_data.R

      - name: Render beta dashboard and blog
        id: beta_render
        if: steps.gate.outputs.render == 'true' && steps.beta_prepare.outcome == 'success'
        continue-on-error: true
        working-directory: beta
        run: |
          for post in dashboard/blog/*/index.qmd; do
            [ -e "$post" ] || continue
            quarto render "$post"
          done

          quarto render dashboard/index.qmd --output-dir _site

          if [ -d dashboard/blog ]; then
            find dashboard/blog -path '*/index.html' -type f | while IFS= read -r html; do
              dest="dashboard/_site/${html#dashboard/}"
              mkdir -p "$(dirname "$dest")"
              cp "$html" "$dest"
            done
          fi

      - name: Assemble GitHub Pages website
        if: steps.gate.outputs.render == 'true'
        env:
          BETA_OK: ${{ steps.beta_render.outcome == 'success' }}
        run: |
          mkdir -p _site/dev
          cp -R stable/dashboard/_site/. _site/

          if [ "$BETA_OK" = "true" ]; then
            cp -R beta/dashboard/_site/. _site/dev/
          else
            printf '%s\n' \
              '<!doctype html><meta charset="utf-8">' \
              '<title>Beta unavailable</title>' \
              '<h1>Beta build failed</h1>' \
              '<p>The beta dashboard could not be built for this deployment.' \
              'The stable site is unaffected.' \
              '<p><a href="../">Back to the main site</a>' \
              > _site/dev/index.html
          fi

      - name: Upload GitHub Pages artifact
        if: steps.gate.outputs.render == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deploy
        if: steps.gate.outputs.render == 'true'
        uses: actions/deploy-pages@v4

      - name: Report a failed beta build
        if: steps.gate.outputs.render == 'true' && steps.beta_render.outcome != 'success'
        run: |
          echo "::error::Beta (dev) dashboard failed to build. Stable was deployed without it; /dev shows a placeholder."
          exit 1
