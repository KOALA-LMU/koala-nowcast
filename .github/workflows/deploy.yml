name: Deploy Website

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Scrape, Pool and Compute"]
    types:
      - completed

permissions:
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      # Supabase's endpoint carries a path (/storage/v1/s3), so virtual-hosted
      # addressing would resolve to a bucket subdomain that does not exist.
      - name: Use path-style S3 addressing
        run: aws configure set default.s3.addressing_style path

      - name: Download data from Supabase Storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET }}
          # Supabase signs against the project's real region; "auto" fails here.
          AWS_DEFAULT_REGION: eu-central-1
          SUPABASE_ENDPOINT: https://agmqujupclwlttjwfnaq.storage.supabase.co/storage/v1/s3
        run: |
          aws s3 sync s3://koala-data/surveys data/surveys/ \
            --endpoint-url "$SUPABASE_ENDPOINT"
          # coalProbs.json is the largest result file and is only ever read by
          # calc_coalProbs.R / pending_configs.R on the compute side; the
          # dashboard uses coalProbs_grouping.json instead. Skipping it roughly
          # halves deploy egress. This job never uploads, so nothing is at risk.
          aws s3 sync s3://koala-data/results data/results/ \
            --endpoint-url "$SUPABASE_ENDPOINT" \
            --exclude "*/coalProbs.json"

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: knitr, rmarkdown

      - name: Prepare dashboard data
        run: Rscript dashboard/prepare_data.R

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render dashboard
        run: quarto render dashboard/index.qmd --output-dir _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/_site

      - uses: actions/deploy-pages@v4
