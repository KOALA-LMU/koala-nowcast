name: Tests

# Guards the pipeline logic. Runs on every push and pull request; the suite uses
# only synthetic fixtures, so it needs no Supabase credentials and no network.

on:
  push:
    branches: [master, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Installs Imports + Suggests from DESCRIPTION and caches the library.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::withr

      - name: Run test suite
        run: Rscript tests/run-tests.R
